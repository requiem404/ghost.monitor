services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghost-monitor-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev